<div class="container-fluid" style="margin-top:80px">
  <div class="mt-4 mx-4">
    <p-toolbar class="my-toolbar">
      <div class="container">
        <div class="row justify-content-between align-items-center">
          <div class="col-12 text-end text-xsm-end">
            <span class="p-input-icon-left">
              <i class="fa fa-search"></i>
              <input pInputText type="text" [(ngModel)]="searchLanguage" [minLength]="4" (input)="filterData()" placeholder="Search Skill" class="search" title="Search Language (Enter at least 3 characters)" style="width: 21rem; height: 45px; margin-right: 10px; margin-bottom: 3px;">
            </span>
            <p-button class="ms-2 add" (click)="showDialog()">Add Skill</p-button>
          </div>
        </div>
      </div>
    </p-toolbar>
  </div>

  <div class="card mt-3 mb-3 mx-4" style="border: 1px solid #e5e7eb; border-radius: 6px; gap: 0.5rem;">
    <p-table #dt [loading]="primengTableHelper.isLoading" (onLazyLoad)="getskills($event)" [value]="primengTableHelper.records" [rows]="primengTableHelper.defaultRecordsCountPerPage" [paginator]="false" [lazy]="true" [responsive]="primengTableHelper.isResponsive" responsiveLayout="scroll" [resizableColumns]="primengTableHelper.resizableColumns" class="table table-bordered my-table">
      <ng-template pTemplate="header">
        <tr>
          <th></th>
          <th title="Skill Name">Skill Name</th>
          <th title="Action">Action</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-termdata>
        <tr>
          <td></td>
          <td title="Question">{{termdata.name}}</td>
          <td>
            <i class="fa fa-pencil-square-o" aria-hidden="true" (click)="editSkills(termdata)"></i>
            <i class="fa fa-trash ms-2" aria-hidden="true" (click)="delete(termdata)"></i>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="paginatorleft">
        <span><b>Total Count: {{ skills?.length }}</b></span>
      </ng-template>
    </p-table>
    <div class="primeng-no-data text-center mt-3" *ngIf="primengTableHelper.totalRecordsCount == 0">
      <h6>No Records Found!</h6>
    </div>
    <p-paginator [rows]="primengTableHelper.defaultRecordsCountPerPage" #paginator (onPageChange)="getskills($event)" [totalRecords]="primengTableHelper.totalRecordsCount" [rowsPerPageOptions]="primengTableHelper.predefinedRecordsCountPerPage">
    </p-paginator>
    <div class="primeng-no-data m-3">
      <h6 style="margin-top:-25px">Total Records: {{primengTableHelper.totalRecordsCount}}</h6>
    </div>
  </div>

  <p-dialog header="Header" [(visible)]="visible" [modal]="true" [style]="{ width: '50rem' }" [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }">
    <ng-template pTemplate="header">
      <div class="inline-flex align-items-center justify-content-center gap-2">
        <span class="font-bold white-space-nowrap"><b>Add Skill</b></span>
      </div>
    </ng-template>
    <form #myForm1="ngForm">
      <div class="form-group row text-start">
        <label for="Language" class="font-bold block col-form-label"><b>Skill</b></label>
        <input required class="form-control ms-2" [(ngModel)]="skillName" id="Language" type="text" placeholder="Enter Skill" name="skillName" pInputText style="height:3rem;width:95%" data-hide-seconds>
      </div>
    </form>
    <ng-template pTemplate="footer">
      <p-button (click)="add()" label="Add" [disabled]="!myForm1.valid" pAutoFocus [autofocus]="true"></p-button>
    </ng-template>
  </p-dialog>

  <p-dialog header="Header" [(visible)]="editVisible" [modal]="true" [style]="{ width: '50rem' }" [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }">
    <ng-template pTemplate="header">
      <div class="inline-flex align-items-center justify-content-center gap-2">
        <span class="font-bold white-space-nowrap"><b>Update Skill Name</b></span>
      </div>
    </ng-template>
    <form #editForm="ngForm">
      <div class="form-group row text-start">
        <label for="Language" class="font-bold block col-form-label"><b>Skill</b></label>
        <input required class="form-control ms-2" [(ngModel)]="editskillName" id="Language" type="text" name="skillName" pInputText style="height:3rem;width:95%" data-hide-seconds>
      </div>
    </form>
    <ng-template pTemplate="footer">
      <p-button (click)="edit()" label="Update" [disabled]="!editForm.valid" pAutoFocus [autofocus]="true"></p-button>
    </ng-template>
  </p-dialog>

  <p-toast position="bottom-right"></p-toast>
</div>
