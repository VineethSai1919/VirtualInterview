<!-- Container for the entire feedback section -->
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            <div class="card shadow">
                <div class="card-body">
                    <!-- Header for the feedback section -->
                    <h2 class="text-center mb-4">Interview Feedback</h2>
                    <!-- Display candidate's name -->
                    <h3 class="text-center mb-4">Candidate: {{reviewDTO[0]?.candidateName}} </h3>
                    <!-- Video player section, displayed if there is feedback data -->
                    <div *ngIf="reviewDTO.length>0" class="w3-col m2" style="width: 100%; display: flex; justify-content: center; align-items: center;">
                        <div class="w3-card ms-3 me-3 w3-round w3-white w3-center mb-3" style="width:60%" (click)="play()">
                            <!-- Container with relative positioning -->
                            <div class="video-container">
                                <!-- Video element with controls and event bindings -->
                                <video #questionPlayer
                                       class="video-poster" controls
                                       [poster]="'../../../assets/Images/AIImage.png'"
                                       (loadeddata)="onLoadedData()"
                                       (waiting)="onWaiting()"
                                       (play)="onPlay()"
                                       (pause)="onPause()">
                                    <source [src]="FeedbackURL" type="audio/mp4" />
                                    Your browser does not support the video element.
                                </video>
                            </div>
                        </div>
                        <br />
                    </div>
                    <!-- Accordion for displaying feedback details -->
                    <p-accordion class="text-start" [activeIndex]="0" styleClass="custom-accordion">
                        <!-- Loop through each feedback item and display it in a tab -->
                        <p-accordionTab *ngFor="let data of reviewDTO; let i = index" [header]="data?.displayText || 'Review ' + (i + 1)">
                            <div class="mb-3">
                                <h5 style="font-weight: 700;">Answer :</h5>
                                <p>{{ data.speechText || 'N/A'}}</p>
                            </div>
                            <div class="mb-3">
                                <h5 style="font-weight: 700;">AI Feedback :</h5>
                                <p>{{ data.aiFeedback || 'N/A'}}</p>
                            </div>
                        </p-accordionTab>
                    </p-accordion>
                </div>
            </div>
        </div>
    </div>
</div>
